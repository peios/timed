[package]
name = "timed"
description = "The Peios time client: the one process permitted to set the clock."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "timed"
path = "src/lib.rs"

[[bin]]
name = "timed"
path = "src/main.rs"

[dependencies]
ntp = { path = "../ntp" }
libc = { workspace = true }
libtimed = { path = "../libtimed" }
# Public wire crates for the daemons Timed talks to: names to resolve, a link
# state to follow, and the roots an NTS-KE handshake is validated against.
# Exact release commits make both the source graph and corresponding-source
# package independent of mutable sibling checkouts.
libresolv = { git = "https://github.com/peios/resolvd.git", rev = "aea35d430d75cb02aa6fa471734ade959112c85b" }
libnetd = { git = "https://github.com/peios/netd.git", rev = "301fdabdeb5ef67fcaa308b9522f9b24aeef4cf4" }
libtrust = { git = "https://github.com/peios/trustd.git", rev = "0887b819ce63e96e6d27164ee9ca4179784ce222" }
peios = { workspace = true }
# The house TLS stack. NTS-KE is TLS 1.3 with an ALPN of "ntske/1" and a
# key exported from the session; nothing else about it is unusual.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = "1"
