[package]
name = "timed"
description = "The Peios time client: the one process permitted to set the clock."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "timed"
path = "src/lib.rs"

[[bin]]
name = "timed"
path = "src/main.rs"

[dependencies]
ntp = { path = "../ntp" }
libc = { workspace = true }
libtimed = { path = "../libtimed" }
# Public wire crates for the daemons Timed talks to: names to resolve, a link
# state to follow, and the roots an NTS-KE handshake is validated against.
# Exact release commits make both the source graph and corresponding-source
# package independent of mutable sibling checkouts.
libresolv = { git = "https://github.com/peios/resolvd.git", rev = "1091520f3c5f97c53b541d1477e05d839a8eb679" }
libnetd = { git = "https://github.com/peios/netd.git", rev = "23af1f6b84f3764d9327eb009ced56b2a16b7aa8" }
libtrust = { git = "https://github.com/peios/trustd.git", rev = "2fd7d86aac00e207320bda1ae11045aec3d61fbf" }
peios = { workspace = true }
# The house TLS stack. NTS-KE is TLS 1.3 with an ALPN of "ntske/1" and a
# key exported from the session; nothing else about it is unusual.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = "1"
