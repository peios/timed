# Base metadata for the packages carved from the timed build tree.
#
#   timed  the time client. Polls authenticated sources, decides which are
#          telling the truth, and steers the system clock. The only process
#          on the machine permitted to set it.
#   clock  its operator command. Reads over the socket; time policy is
#          written with reg.
#
# Two packages because `clock status` should work on a machine that gets
# its time some other way, and because a command every user may run should
# not drag a privileged daemon in with it.
#
# There is deliberately no NTP *server* here. That is a separate, future,
# unprivileged package which subscribes to timed's socket for its state:
# the client holds the dangerous privilege and listens on nothing, while a
# server is exposed on UDP 123 to the whole domain and needs no privilege
# at all. Every machine runs timed; only a domain controller would run the
# server.

format = "peipkg"

[package]
version      = "{{version}}-4"
architecture = "x86_64"
license      = "MIT"
