[package]
name        = "dev.peios.timed-debuginfo"
description = "Debugging symbols for the Peios time service"
# The same crate closure as timed; checked by build.main.
license     = "((MIT OR Apache-2.0) AND Unicode-3.0) AND Apache-2.0 AND (Apache-2.0 AND ISC) AND (Apache-2.0 OR ISC OR MIT) AND (Apache-2.0 OR MIT) AND BSD-3-Clause AND ISC AND MIT AND (MIT OR Unlicense)"

[dependencies]
"dev.peios.timed" = "= {{release}}"

[files]
"@source:LICENSE"                  = "usr/share/licenses/dev.peios.timed-debuginfo/LICENSE"
":licenses/timed/**"               ="usr/share/licenses/dev.peios.timed-debuginfo/third-party"
":debug/timed/usr/lib/debug/**"    = "usr/lib/debug"
