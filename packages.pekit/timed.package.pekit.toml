# timed — the Peios time client.

[package]
description = "Peios time client - keeps the system clock synchronised with authenticated network sources"

[files]
":usr/sbin/timed" = "usr/sbin/timed"
# Run as SYSTEM by ExecStartPre, so the daemon itself need not be.
":usr/libexec/timed/prepare-state" = "usr/libexec/timed/prepare-state"
# The service definition, the Time keys, and the privilege grant. Inert
# until an image names them in [registry] autoapply.
":usr/share/regim/timed-service.reg" = "usr/share/regim/timed-service.reg"
":usr/share/regim/timed-policy.reg" = "usr/share/regim/timed-policy.reg"
":usr/share/regman/timed.regman" = "usr/share/regman/timed.regman"
