# timed — Peios's authenticated network time authority and its independent
# operator client. One locked build produces two runtime packages, per-binary
# symbols, exact debug sources, third-party notices, and corresponding source.
# Network access is confined to build.vendor; build.main and test are offline.

out_dir = "out"

[source_package]
name = "dev.peios.timed-source"

[build.vendor]
command = '''
set -eu
export CARGO_HOME=/tmp/cargo-timed-vendor
export CARGO_NET_GIT_FETCH_WITH_CLI=true
mkdir -p "$CARGO_HOME" "$PEKIT_OUT"

# Resolve every immutable input while this acquisition-only target has network
# access, then reject mutable path dependencies outside the release tree before
# compiling anything. All subsequent stages use only the resulting vendor tree.
cargo fetch --locked
cargo metadata --locked --offline --format-version 1 |
  python3 -c '
import json, pathlib, sys
metadata = json.load(sys.stdin)
root = pathlib.Path.cwd().resolve()
members = set(metadata["workspace_members"])
external_paths = []
for package in metadata["packages"]:
    if package["id"] in members or package.get("source") is not None:
        continue
    manifest = pathlib.Path(package["manifest_path"]).resolve()
    try:
        manifest.relative_to(root)
    except ValueError:
        external_paths.append(str(manifest))
if external_paths:
    raise SystemExit(
        "timed: mutable sibling Cargo dependencies are not publishable:\n  "
        + "\n  ".join(sorted(external_paths))
    )
'

cargo vendor --locked "$PEKIT_OUT/vendor" > "$PEKIT_OUT/cargo-config.toml"
test -s "$PEKIT_OUT/cargo-config.toml"
test -n "$(find "$PEKIT_OUT/vendor" -mindepth 1 -maxdepth 1 -type d -print -quit)"
'''

[build.vendor.dependencies.peipkg]
"org.rust-lang.rust"          = ">= 1.98.1, < 2"
"org.git.git"                 = "*"
"org.mozilla.ca-certificates" = "*"
"org.gnu.findutils"           = "*"
"org.python.python3"          = "*"

[build.vendor.dependencies.apt]
cargo           = "*"
git             = "*"
ca-certificates = "*"
findutils       = "*"
python3         = "*"

[build.main]
needs = ["vendor"]
command = '''
set -eu
set -o pipefail 2>/dev/null || true

SRC=$(pwd -P)
DEBUG_PREFIX=/usr/src/debug/dev.peios.timed-$PEKIT_VERSION
DEBUG_ROOT=$PEKIT_OUT$DEBUG_PREFIX
LICENSE_ROOT=$PEKIT_OUT/licenses
export CARGO_HOME=$PEKIT_OUT/cargo-home
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"

for tool in cargo rustc git gcc pkg-config python3 find sort cmp readelf objcopy strip debugedit gzip; do
  command -v "$tool" >/dev/null || {
    echo "timed: missing required build tool: $tool" >&2
    exit 1
  }
done

# Native builds consume the packaged ABI, never an ad-hoc libpeios build.
unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
test "$(pkg-config --modversion peios)" = 0.5.0 || {
  echo "timed: dev.peios.libpeios-devel 0.5.0 is required" >&2
  exit 1
}
export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"

# A source tag and all four workspace crates are one release family.
cargo metadata --locked --offline --no-deps --format-version 1 |
  python3 -c '
import json, os, sys
metadata = json.load(sys.stdin)
members = set(metadata["workspace_members"])
versions = sorted({p["version"] for p in metadata["packages"] if p["id"] in members})
expected = os.environ["PEKIT_VERSION"]
if versions != [expected]:
    raise SystemExit(f"timed: workspace versions {versions!r} do not equal package version {expected!r}")
'

# The clock floor must be both safe and reproducible. A Git release's commit
# timestamp meets both requirements; explicit SOURCE_DATE_EPOCH still wins.
if test -z "${SOURCE_DATE_EPOCH:-}"; then
  SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
fi
case "$SOURCE_DATE_EPOCH" in
  ''|*[!0-9]*) echo "timed: SOURCE_DATE_EPOCH is not an epoch" >&2; exit 1 ;;
esac
export SOURCE_DATE_EPOCH

# Stable DWARF names exclude both source and disposable build roots.
export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$PEKIT_WORKSPACE_ROOT=$DEBUG_PREFIX/.workspace --remap-path-prefix=$PEKIT_OUT_BASE=$DEBUG_PREFIX/.build --remap-path-prefix=$SRC=$DEBUG_PREFIX --remap-path-prefix=$PEKIT_VENDOR_OUT/vendor=$DEBUG_PREFIX/vendor"

cargo test --release --workspace --locked --offline --target-dir "$PEKIT_OUT/tests"
cargo build --release --locked --offline --bin timed --bin clock --target-dir "$PEKIT_OUT/target-a"
cargo build --release --locked --offline --bin timed --bin clock --target-dir "$PEKIT_OUT/target-b"
cmp "$PEKIT_OUT/target-a/release/timed" "$PEKIT_OUT/target-b/release/timed"
cmp "$PEKIT_OUT/target-a/release/clock" "$PEKIT_OUT/target-b/release/clock"

mkdir -p "$PEKIT_OUT/usr/sbin" "$PEKIT_OUT/usr/bin" \
         "$PEKIT_OUT/usr/libexec/timed" "$PEKIT_OUT/usr/share/regim" \
         "$PEKIT_OUT/usr/share/regman" "$PEKIT_OUT/usr/share/man/man1" \
         "$PEKIT_OUT/usr/share/man/man8"
install -m 0755 "$PEKIT_OUT/target-a/release/timed" "$PEKIT_OUT/usr/sbin/timed"
install -m 0755 "$PEKIT_OUT/target-a/release/clock" "$PEKIT_OUT/usr/bin/clock"
install -m 0755 "$SRC/libexec/prepare-state" "$PEKIT_OUT/usr/libexec/timed/prepare-state"
install -m 0644 "$SRC/registry.d/timed-service.reg" "$PEKIT_OUT/usr/share/regim/timed-service.reg"
install -m 0644 "$SRC/registry.d/timed-policy.reg" "$PEKIT_OUT/usr/share/regim/timed-policy.reg"
install -m 0644 "$SRC/timed.regman" "$PEKIT_OUT/usr/share/regman/timed.regman"
gzip -9n < "$SRC/man/clock.1" > "$PEKIT_OUT/usr/share/man/man1/clock.1.gz"
gzip -9n < "$SRC/man/timed.8" > "$PEKIT_OUT/usr/share/man/man8/timed.8.gz"

# Preserve every licence notice in the locked Linux build graph and record the
# exact expression declared by each crate. The collector fails closed.
python3 "$SRC/tools/collect-rust-metadata.py" --licence-root "$LICENSE_ROOT"
test -s "$LICENSE_ROOT/crate-licenses.tsv"

# Split each independently installable executable, sharing one exact source
# tree for the release and its vendored/path dependency closure.
: > "$PEKIT_OUT/.debug-sources"
split_debug() {
  component=$1
  elf=$2
  list=$PEKIT_OUT/.debug-$component
  debugedit -b "$SRC" -d "$DEBUG_PREFIX" -l "$list" -n "$elf"
  cat "$list" >> "$PEKIT_OUT/.debug-sources"
  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  test -n "$build_id"
  first=$(printf %s "$build_id" | cut -c1-2)
  rest=$(printf %s "$build_id" | cut -c3-)
  debug=$PEKIT_OUT/debug/$component/usr/lib/debug/.build-id/$first/$rest.debug
  mkdir -p "$(dirname "$debug")"
  objcopy --only-keep-debug "$elf" "$debug"
  strip --strip-unneeded "$elf"
  objcopy --add-gnu-debuglink="$debug" "$elf"
  rm -f "$list"
}

split_debug timed "$PEKIT_OUT/usr/sbin/timed"
split_debug clock "$PEKIT_OUT/usr/bin/clock"

mkdir -p "$DEBUG_ROOT"
tr '\0' '\n' < "$PEKIT_OUT/.debug-sources" | LC_ALL=C sort -u |
while IFS= read -r source; do
  test -n "$source" || continue
  case "$source" in */) continue ;; esac
  case "$source" in
    "$DEBUG_PREFIX"/vendor/*)
      relative=${source#"$DEBUG_PREFIX"/}
      origin=$PEKIT_VENDOR_OUT/$relative
      ;;
    "$DEBUG_PREFIX"/*)
      relative=${source#"$DEBUG_PREFIX"/}
      origin=$SRC/$relative
      ;;
    vendor/*)
      relative=$source
      origin=$PEKIT_VENDOR_OUT/$source
      ;;
    *)
      relative=$source
      origin=$SRC/$source
      ;;
  esac
  test -f "$origin" || continue
  mkdir -p "$DEBUG_ROOT/$(dirname "$relative")"
  cp "$origin" "$DEBUG_ROOT/$relative"
done
rm -f "$PEKIT_OUT/.debug-sources"
test -n "$(find "$DEBUG_ROOT" -type f -print -quit)"

# Installed-payload gates cover CLI, scripts, policy, service identity, and
# the reproducible build floor using only staged files.
"$PEKIT_OUT/usr/bin/clock" --help > "$PEKIT_OUT/clock-help"
grep -F 'usage: clock <command>' "$PEKIT_OUT/clock-help" >/dev/null
/usr/bin/sh -n "$PEKIT_OUT/usr/libexec/timed/prepare-state"
gzip -t "$PEKIT_OUT/usr/share/man/man1/clock.1.gz"
gzip -t "$PEKIT_OUT/usr/share/man/man8/timed.8.gz"
python3 - "$PEKIT_OUT" "$SOURCE_DATE_EPOCH" <<'PY'
import json, pathlib, sys
root = pathlib.Path(sys.argv[1])
epoch = int(sys.argv[2])
service = json.loads((root / "usr/share/regim/timed-service.reg").read_text())
policy = json.loads((root / "usr/share/regim/timed-policy.reg").read_text())
assert service["keys"] and policy["keys"]
values = {
    value["name"]: value["data"]
    for key in service["keys"]
    if key["path"] == r"Machine\System\Services\timed"
    for value in key["values"]
}
assert values["ImagePath"] == "/usr/sbin/timed"
assert values["Identity"] == "LocalService"
assert values["RequiredPrivileges"] == ["SeSystemtimePrivilege", "SeChangeNotifyPrivilege"]
assert values["ExecStartPre"] == ["/usr/libexec/timed/prepare-state"]
assert values["HookIdentity"] == "SYSTEM"
assert values["Wants"] == ["trustd", "resolvd"]
assert epoch.to_bytes(8, "little", signed=True) in (root / "usr/sbin/timed").read_bytes()
PY
rm -f "$PEKIT_OUT/clock-help"

# Fail closed on linkage, full RELRO, packed relative relocations, NX stack,
# split-debug integrity, and leakage of build/checkout paths.
for record in \
  "timed:$PEKIT_OUT/usr/sbin/timed" \
  "clock:$PEKIT_OUT/usr/bin/clock"
do
  component=${record%%:*}
  elf=${record#*:}
  readelf -h "$elf" | grep -Eq 'Type:[[:space:]]+DYN'
  readelf -lW "$elf" | grep -q 'GNU_RELRO'
  readelf -lW "$elf" | grep -Eq 'GNU_STACK[[:space:]].*RW[[:space:]]'
  ! readelf -lW "$elf" | grep -Eq 'GNU_STACK[[:space:]].*RWE'
  readelf -dW "$elf" | grep -q 'BIND_NOW'
  readelf -dW "$elf" | grep -q 'RELR'
  readelf -dW "$elf" | grep -Eq 'FLAGS_1.*PIE'
  readelf -dW "$elf" | grep -Fq 'Shared library: [libpeios.so.0]'
  ! readelf -dW "$elf" | grep -Eq '(RPATH|RUNPATH|TEXTREL)'
  ! readelf -SW "$elf" | grep -q '\.debug_info'
  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  debug=$PEKIT_OUT/debug/$component/usr/lib/debug/.build-id/$(printf %s "$build_id" | cut -c1-2)/$(printf %s "$build_id" | cut -c3-).debug
  test -s "$debug"
  readelf -SW "$debug" | grep -q '\.debug_info'
  test "$(readelf -n "$debug" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)" = "$build_id"
  for forbidden in "$SRC" "$PEKIT_VENDOR_OUT" "$PEKIT_OUT_BASE" "$PEKIT_WORKSPACE_ROOT"; do
    ! grep -aF "$forbidden" "$elf" "$debug" >/dev/null
  done
done
'''

[build.main.dependencies.peipkg]
"org.git.kernel.dash"      = "*"
"org.gnu.coreutils"        = "*"
"org.gnu.findutils"        = "*"
"org.gnu.grep"             = "*"
"org.gnu.sed"              = "*"
"org.gnu.gzip"             = "*"
"org.git.git"              = "*"
"org.rust-lang.rust"       = ">= 1.98.1, < 2"
"org.gnu.gcc"              = ">= 16, < 17"
"org.gnu.binutils"         = "*"
"org.sourceware.debugedit" = "*"
"org.python.python3"       = "*"
"org.llvm.clang-devel"     = ">= 22, < 23"
"org.pkgconf.pkgconf"      = "*"
"dev.peios.libpeios-devel" = "= 0.5.0-1"

[build.main.dependencies.apt]
dash            = "*"
coreutils       = "*"
findutils       = "*"
grep            = "*"
sed             = "*"
gzip            = "*"
git             = "*"
cargo           = "*"
rustc           = "*"
gcc             = "*"
binutils        = "*"
debugedit       = "*"
python3         = "*"
"libclang-dev" = "*"
pkgconf         = "*"

[test]
needs = ["vendor"]
command = '''
set -eu
export CARGO_HOME=$PEKIT_OUT/cargo-home
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"
unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
test "$(pkg-config --modversion peios)" = 0.5.0
export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"
cargo test --workspace --locked --offline
'''

[test.dependencies.peipkg]
"org.git.kernel.dash"      = "*"
"org.gnu.coreutils"        = "*"
"org.rust-lang.rust"       = ">= 1.98.1, < 2"
"org.gnu.gcc"              = ">= 16, < 17"
"org.llvm.clang-devel"     = ">= 22, < 23"
"org.pkgconf.pkgconf"      = "*"
"dev.peios.libpeios-devel" = "= 0.5.0-1"

[test.dependencies.apt]
dash            = "*"
coreutils       = "*"
cargo           = "*"
rustc           = "*"
gcc             = "*"
"libclang-dev" = "*"
pkgconf         = "*"

[clean]
command = "rm -rf out"
