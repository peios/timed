# timed — the Peios time client — and clock, its operator command. One
# cargo workspace, two shipped binaries; see packages.pekit/.
#
# The libpeios bootstrap mirrors netd's, resolvd's and trustd's: pkg-config
# rather than PEIOS_LIB_DIR, so peios-sys does not bake a checkout-local
# rpath into a shipped binary, and a synthesized peios.pc from the sibling
# trees when libpeios-devel is not installed in the build root.
#
# SOURCE_DATE_EPOCH is honoured by timed's build.rs, which stamps the build
# time into the binary as the floor below which the clock is never set.
# Left unset, the floor is the moment of the build, which is what we want:
# it must be recent enough that every root in the shipped trust store was
# already valid, and old enough that it is never in the future.

out_dir = "out"

[build]
command = """
set -eu
set -o pipefail 2>/dev/null || true

SRC="$(pwd)"
REPO_ROOT="$(cd "$SRC/.." && pwd)"

for tool in cargo rustc gcc pkg-config; do
  command -v "$tool" >/dev/null || { echo "missing required timed build tool: $tool" >&2; exit 1; }
done

unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI

if ! pkg-config --exists peios; then
  LIBPEIOS_ROOT="$REPO_ROOT/libpeios"
  PKM_UAPI_ROOT="$REPO_ROOT/pkm/out/build/headers/usr/include"
  [ -f "$LIBPEIOS_ROOT/Cargo.toml" ] || { echo "libpeios not found at $LIBPEIOS_ROOT" >&2; exit 1; }
  [ -d "$LIBPEIOS_ROOT/include/peios" ] || { echo "libpeios headers not found" >&2; exit 1; }
  [ -d "$PKM_UAPI_ROOT/pkm" ] || { echo "pkm UAPI headers not found at $PKM_UAPI_ROOT" >&2; exit 1; }
  cargo build --release --locked --manifest-path "$LIBPEIOS_ROOT/Cargo.toml"
  PC_DIR="$PEKIT_OUT/pkgconfig"
  mkdir -p "$PC_DIR"
  LIBPEIOS_VERSION="$(sed -n 's/^version = "\\([^"]*\\)".*/\\1/p' "$LIBPEIOS_ROOT/Cargo.toml" | head -1)"
  {
    printf 'prefix=%s\\n' "$LIBPEIOS_ROOT"
    printf 'exec_prefix=${prefix}\\n'
    printf 'libdir=%s/target/release\\n' "$LIBPEIOS_ROOT"
    printf 'includedir=%s/include\\n' "$LIBPEIOS_ROOT"
    printf '\\n'
    printf 'Name: peios\\n'
    printf 'Description: Peios userspace C ABI library (libpeios)\\n'
    printf 'Version: %s\\n' "$LIBPEIOS_VERSION"
    printf 'Libs: -L${libdir} -lpeios\\n'
    printf 'Cflags: -I${includedir} -I%s\\n' "$PKM_UAPI_ROOT"
  } > "$PC_DIR/peios.pc"
  export PKG_CONFIG_PATH="$PC_DIR${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
fi

export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"

cargo build --release --locked --bin timed --bin clock --target-dir "$PEKIT_OUT/target"

mkdir -p "$PEKIT_OUT/usr/sbin" "$PEKIT_OUT/usr/bin"
install -m 0755 "$PEKIT_OUT/target/release/timed" "$PEKIT_OUT/usr/sbin/timed"
install -m 0755 "$PEKIT_OUT/target/release/clock" "$PEKIT_OUT/usr/bin/clock"

# The pre-start hook that gives timed a directory it can own; see the
# script and timed-service.reg for why a least-privileged daemon needs one.
mkdir -p "$PEKIT_OUT/usr/libexec/timed"
install -m 0755 "$SRC/libexec/prepare-state" "$PEKIT_OUT/usr/libexec/timed/prepare-state"

# Seeds are offered, not applied: an image opts in with [registry] autoapply.
mkdir -p "$PEKIT_OUT/usr/share/regim" "$PEKIT_OUT/usr/share/regman"
install -m 0644 "$SRC/registry.d/timed-service.reg" "$PEKIT_OUT/usr/share/regim/timed-service.reg"
install -m 0644 "$SRC/registry.d/timed-policy.reg" "$PEKIT_OUT/usr/share/regim/timed-policy.reg"
install -m 0644 "$SRC/timed.regman" "$PEKIT_OUT/usr/share/regman/timed.regman"
"""

[build.dependencies.peipkg]
cargo = "*"
rust = "*"
gcc = "*"
pkgconf-pkg-config = "*"
libpeios-devel = "*"
kernel-headers = "*"

[test]
command = "cargo test --workspace"

[clean]
command = "cargo clean"
