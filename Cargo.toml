[workspace]
resolver = "2"
members = ["ntp", "libtimed", "timed", "clock"]

# timed is its own workspace root, like netd, resolvd and trustd.
#
#   ntp       the wire: NTPv4 packets, NTS extension fields, the NTS-KE
#             record format. Pure codec — no sockets, no clock, no policy.
#             Everything hostile arrives through here, so it is the crate
#             that gets fuzzed hardest.
#   libtimed  the control wire: paths, rights, request/reply codec, the
#             shapes `clock` and the future NTP server read.
#   timed     the daemon. The one process on the machine permitted to set
#             the clock.
#   clock     the operator command.
#
# There is deliberately no server here. An NTP *server* is a separate,
# future, unprivileged package that subscribes to timed for its state: the
# client holds the dangerous privilege but listens on nothing, and the
# server is exposed to the whole domain but needs no privilege at all.
# Putting them in one process would give the exposed half the privileged
# half's rights, which is the arrangement every other Peios daemon pair
# (netd/resolvd, authd/lpsd) exists to avoid.

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[profile.release]
# Packaging splits symbols after linking. Keep full DWARF in the release
# executable until that split has happened, and keep incremental state out of
# release reproducibility.
debug = 2
split-debuginfo = "off"
incremental = false

[workspace.dependencies]
libc = "0.2"
peios = { git = "https://github.com/peios/peios-rs.git", rev = "f4309f78fbaa878a14429a5e07d778dba9ddfab7", package = "peios" }
